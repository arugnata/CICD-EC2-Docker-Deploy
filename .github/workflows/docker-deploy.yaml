name: Docker CI/CD to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3️⃣ Build and push Docker image
      - name: Build & Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/myapp:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/myapp:latest

      # 4️⃣ Configure SSH
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config

      # 5️⃣ Add EC2 Private Key
      - name: Add SSH Key
        run: |
          echo $SSH_KEY64 | base64 -d > mykey.pem
          chmod 600 mykey.pem
        env:
          SSH_KEY64: ${{ secrets.SSH_KEY64 }}

      # 6️⃣ Deploy to EC2
      - name: Deploy to EC2
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          ssh -i mykey.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.SERVER_IP }} << 'EOF'
            # Stop existing container if running
            docker rm -f myapp || true
            # Pull latest image from Docker Hub
            docker pull $DOCKER_USERNAME/myapp:latest
            # Run container
            docker run -d -p 80:3000 --name myapp $DOCKER_USERNAME/myapp:latest
EOF
