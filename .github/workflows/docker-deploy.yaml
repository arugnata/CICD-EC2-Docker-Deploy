name: Docker CI/CD to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/myapp:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/myapp:latest

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config

      - name: Add SSH Key
        run: |
          echo $SSH_KEY64 | base64 -d > mykey.pem
          chmod 600 mykey.pem
        env:
          SSH_KEY64: ${{ secrets.SSH_KEY64 }}

      - name: Deploy to EC2
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          ssh -i mykey.pem -o StrictHostKeyChecking=no ubuntu@$SERVER_IP "\
            docker rm -f myapp || true && \
            docker pull $DOCKER_USERNAME/myapp:latest && \
            docker run -d -p 80:3000 --name myapp $DOCKER_USERNAME/myapp:latest"
