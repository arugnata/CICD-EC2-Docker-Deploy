name: Docker CI/CD to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t myapp:latest .

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config

      - name: Add SSH Key
        run: |
          echo $SSH_KEY64 | base64 -d > mykey.pem
          chmod 600 mykey.pem
        env:
          SSH_KEY64: ${{ secrets.SSH_KEY64 }}

      - name: Deploy to EC2
        run: |
          ssh -i mykey.pem ubuntu@${{ secrets.SERVER_IP }} << 'EOF'
            docker rm -f myapp || true
            docker run -d -p 80:80 --name myapp myapp:latest
          EOF
