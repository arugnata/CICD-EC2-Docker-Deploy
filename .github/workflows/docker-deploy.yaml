name: Docker CI/CD to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Step 1: Login to Docker Hub (so EC2 can pull image)
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 2: Build & Push Docker Image
      - name: Build & Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/myapp:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/myapp:latest

      # Step 3: Configure SSH
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config

      # Step 4: Decode Base64 Private Key
      - name: Add SSH Key
        run: |
          echo $SSH_KEY64 | base64 -d > mykey.pem
          chmod 600 mykey.pem
        env:
          SSH_KEY64: ${{ secrets.SSH_KEY64 }}

      # Step 5: Deploy to EC2
      - name: Deploy to EC2
        run: |
          ssh -i mykey.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.SERVER_IP }} <<EOF
            docker rm -f myapp || true
            docker pull ${{ secrets.DOCKER_USERNAME }}/myapp:latest
            docker run -d -p 80:80 --name myapp ${{ secrets.DOCKER_USERNAME }}/myapp:latest
          EOF
